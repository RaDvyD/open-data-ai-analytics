apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: analytics-app
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 80          # Порт всередині контейнера
      targetPort: 80
      nodePort: 30080   # Порт назовні сервера (будемо заходити на нього)