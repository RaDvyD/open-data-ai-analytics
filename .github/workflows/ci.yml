name: CI (modules)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      module:
        description: "Which module to run (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - load_data
          - data_quality
          - research
          - visualize

jobs:
  run-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [load_data, data_quality, research, visualize]

    steps:
      # Створюємо змінну-перемикач, яка скаже, чи треба запускати цей модуль
      - name: Check if module should run
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.module }}" != "all" && "${{ inputs.module }}" != "${{ matrix.module }}" ]]; then
            echo "run_step=false" >> $GITHUB_ENV
          else
            echo "run_step=true" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        if: env.run_step == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.run_step == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run module
        if: env.run_step == 'true'
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Running src/${{ matrix.module }}.py"
          python src/${{ matrix.module }}.py > artifacts/${{ matrix.module }}/run.log 2>&1

      - name: Upload artifacts
        if: env.run_step == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.module }}
          path: artifacts/${{ matrix.module }}